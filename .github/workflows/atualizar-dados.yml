name: Atualizar dados

on:
  schedule:
    # 07:00 em Brasília (10:00 UTC): milhas e ida e volta em dinheiro
    - cron: "0 10 * * *"
    # 19:00 em Brasília (22:00 UTC): só milhas, sem gastar buscas do SerpApi
    - cron: "0 22 * * *"
  # Execução manual, pelo GitHub ou pelo botão "Atualizar agora" da página
  workflow_dispatch:
    inputs:
      parte:
        description: "O que atualizar (tudo gasta 7 buscas do SerpApi)"
        type: choice
        options: [milhas, tudo]
        default: milhas

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar milhas e preços
        env:
          SEATS_AERO_KEY: ${{ secrets.SEATS_AERO_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PARTE: ${{ github.event_name == 'workflow_dispatch' && inputs.parte || (github.event.schedule == '0 22 * * *' && 'milhas' || 'tudo') }}
        run: python scripts/update_data.py

      - name: Salvar dados
        run: |
          git config user.name "radar-de-milhas"
          git config user.email "radar-de-milhas@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Atualiza dados $(date -u +%F' '%H:%M) UTC"
          git pull --rebase
          git push
